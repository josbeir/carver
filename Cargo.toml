[workspace]
members = [
  "apps/carver-gtk",
  "apps/carver-mcp",
  "crates/carver-agent-integration",
  "crates/carver-editor-protocol",
  "crates/carver-export",
  "crates/carver-config",
  "crates/carver-domain",
  "crates/carver-library-port",
  "crates/carver-sdk",
  "crates/carver-storage-sqlite",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
version = "0.1.0"
authors = ["Carver contributors"]

[workspace.dependencies]
async-channel = "2.5"
base64 = "0.22"
carve-lang = "0.1.4"
directories = "6.0"
glib = "0.22"
gdk-pixbuf = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
libadwaita = { package = "libadwaita", version = "0.9", features = ["gtk_v4_22", "v1_9"] }
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmcp = { version = "3.2", features = ["transport-io"] }
schemars = "1.2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-std"] }
sha2 = "0.10"
sourceview5 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
zip = { version = "8.6", default-features = false }
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde", "local-offset"] }
toml = "1.1"
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 1
