[workspace]
members = [
  "apps/carver-gtk",
  "crates/carver-config",
  "crates/carver-domain",
  "crates/carver-richtext",
  "crates/carver-sdk",
  "crates/carver-storage-sqlite",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
version = "0.1.0"
authors = ["Carver contributors"]

[workspace.dependencies]
async-channel = "2.5"
carve-lang = "0.1.4"
directories = "6.0"
glib = "0.21"
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
libadwaita = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde", "local-offset"] }
toml_edit = { version = "0.23", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 1
