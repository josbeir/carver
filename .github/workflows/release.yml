name: Release packages and assets

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  metadata:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - name: Read workspace version and verify release tag
        id: version
        shell: python
        run: |
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if os.environ['LANE_REF_TYPE'] == 'tag':
              assert os.environ['LANE_TAG'] == f'v{version}', 'Tag must match workspace version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
    timeout-minutes: 30
  flatpak:
    needs: metadata
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - name: Validate packaging metadata
        run: |
          flatpak-builder --show-manifest packaging/flatpak/io.github.josbeir.Carver.json > /dev/null
          appstreamcli validate --no-net apps/carver-gtk/resources/io.github.josbeir.Carver.metainfo.xml
          desktop-file-validate apps/carver-gtk/resources/io.github.josbeir.Carver.desktop
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.josbeir.Carver.json
          bundle: carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Create bundle checksum
        env:
          BUNDLE: carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
        run: sha256sum "$BUNDLE" > "$BUNDLE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: carver-flatpak-x86_64-${{ inputs.publish && 'publish' || 'check' }}
          path: |
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
          if-no-files-found: error

    timeout-minutes: 30
  release:
    name: Publish release assets
    if: startsWith(format('refs/tags/{0}', inputs.tag), 'refs/tags/v')
    needs: [metadata, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - uses: actions/download-artifact@v4
        with:
          pattern: carver-*-x86_64-${{ inputs.publish && 'publish' || 'check' }}
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.source_sha }}
          draft: true
        if: ${{ inputs.publish }}
    timeout-minutes: 30
env:
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}
