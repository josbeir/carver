name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read workspace version and verify release tag
        id: version
        shell: python
        run: |
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match workspace version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
  flatpak:
    needs: metadata
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging metadata
        run: |
          flatpak-builder --show-manifest packaging/flatpak/io.github.josbeir.Carver.json > /dev/null
          appstreamcli validate --no-net apps/carver-gtk/resources/io.github.josbeir.Carver.metainfo.xml
          desktop-file-validate apps/carver-gtk/resources/io.github.josbeir.Carver.desktop
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.josbeir.Carver.json
          bundle: carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Create bundle checksum
        env:
          BUNDLE: carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
        run: sha256sum "$BUNDLE" > "$BUNDLE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: carver-flatpak-x86_64
          path: |
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: carver-*-x86_64
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
