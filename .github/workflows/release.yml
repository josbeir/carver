name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read workspace version and verify release tag
        id: version
        shell: python
        run: |
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match workspace version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
  flatpak:
    needs: metadata
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging metadata
        run: |
          flatpak-builder --show-manifest packaging/flatpak/io.github.josbeir.Carver.json > /dev/null
          appstreamcli validate --no-net apps/carver-gtk/resources/io.github.josbeir.Carver.metainfo.xml
          desktop-file-validate apps/carver-gtk/resources/io.github.josbeir.Carver.desktop
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.josbeir.Carver.json
          bundle: carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Create bundle checksum
        env:
          BUNDLE: carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
        run: sha256sum "$BUNDLE" > "$BUNDLE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: carver-flatpak-x86_64
          path: |
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
          if-no-files-found: error

  appimage:
    needs: metadata
    name: Build x86_64 AppImage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carver-gtk/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: carver-appimage
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good glib-networking adwaita-icon-theme weston bubblewrap
      - name: Build
        run: |
          npm ci --prefix apps/carver-gtk/web
          npm run build --prefix apps/carver-gtk/web
          cargo build --release --locked -p carver-gtk -p carver-mcp
      - name: Download verified packager
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/linuxdeploy.AppImage" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/linuxdeploy.AppImage"
          curl -fL --retry 3 -o "$RUNNER_TEMP/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c -
          curl -fL --retry 3 -o "$RUNNER_TEMP/patchelf.tar.gz" https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz
          echo "a6818fef80128fb354423234ecacdcca3e993913d774e5d8346bc63f70fed4cf  $RUNNER_TEMP/patchelf.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/carver-patchelf"
          tar -xzf "$RUNNER_TEMP/patchelf.tar.gz" -C "$RUNNER_TEMP/carver-patchelf"
      - name: Package
        env:
          LINUXDEPLOY: ${{ runner.temp }}/linuxdeploy.AppImage
          LDAI_RUNTIME_FILE: ${{ runner.temp }}/runtime-x86_64
          CARVER_VERSION: ${{ needs.metadata.outputs.version }}
          PATCHELF: ${{ runner.temp }}/carver-patchelf/bin/patchelf
        run: |
          python3 packaging/appimage/test-relocation.py
          bash packaging/appimage/build.sh
      - name: Smoke test
        env:
          IMAGE: target/carver-${{ needs.metadata.outputs.version }}-x86_64.AppImage
        run: |
          "$IMAGE" --appimage-extract-and-run --command=carver-mcp --help
          bash packaging/appimage/smoke-test.sh "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: carver-appimage-x86_64
          path: |
            target/carver-${{ needs.metadata.outputs.version }}-x86_64.AppImage
            target/carver-${{ needs.metadata.outputs.version }}-x86_64.AppImage.sha256
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, flatpak, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: carver-*-x86_64
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak
            carver-${{ needs.metadata.outputs.version }}-x86_64.flatpak.sha256
            carver-${{ needs.metadata.outputs.version }}-x86_64.AppImage
            carver-${{ needs.metadata.outputs.version }}-x86_64.AppImage.sha256
