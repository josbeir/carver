name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Quality (stable)
    # GTK 4.22 requires Ubuntu 26.04; ubuntu-latest currently provides GTK 4.14.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carver-gtk/web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache registry, dependency artifacts, and CI-installed cargo tools across runs.
          # The stable and MSRV builds have distinct caches because Rust artifacts are not ABI compatible.
          shared-key: carver-stable
          cache-all-crates: true
      - name: Install GTK dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev weston
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build the bundled editor
        working-directory: apps/carver-gtk/web
        run: npm ci && npm test && npm run build
      - name: Lint
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -D clippy::perf
      - name: Test
        run: >-
          ./scripts/with-weston.sh cargo test --workspace --locked --
          --include-ignored --test-threads=1
      - name: Install coverage tool
        run: >-
          rustup component add llvm-tools-preview &&
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Coverage
        run: |
          mkdir -p coverage
          ./scripts/with-weston.sh cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80 \
            --lcov --output-path coverage/lcov.info -- --include-ignored --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Dependency policy
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check

  msrv:
    name: MSRV (Rust 1.92)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carver-gtk/web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep MSRV artifacts isolated from stable while reusing them on subsequent runs.
          shared-key: carver-msrv-1.92
      - name: Install GTK dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
      - name: Check MSRV compatibility
        run: npm ci --prefix apps/carver-gtk/web && npm run build --prefix apps/carver-gtk/web && cargo check --workspace --all-targets --all-features --locked
