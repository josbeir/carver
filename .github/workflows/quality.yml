name: Quality

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` drives the single coverage run for a PR opened as a draft.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Quality (stable)
    # Cancel superseded runs for this branch. The coverage job is deliberately in its own group so
    # a later push cannot cancel the one coverage run a PR gets.
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    # GTK 4.22 requires Ubuntu 26.04; ubuntu-latest currently provides GTK 4.14.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carver-gtk/web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache registry, dependency artifacts, and CI-installed cargo tools across runs.
          # The stable and MSRV builds have distinct caches because Rust artifacts are not ABI compatible.
          shared-key: carver-stable
          cache-all-crates: true
      - name: Install GTK dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev weston gettext
      - name: Format
        run: cargo fmt --all -- --check
      - name: Translations
        run: |
          ./scripts/update-translations.sh
          git diff --exit-code -I 'POT-Creation-Date:' -I 'rust-format' -I '^#:' po/
          for catalog in po/*.po; do
            output="$(mktemp --suffix=.mo)"
            msgfmt --check -c --strict -o "$output" "$catalog"
            rm -f "$output"
          done
      - name: Check the bundled TypeScript editor
        working-directory: apps/carver-gtk/web
        run: npm ci && npm run check
      - name: Lint
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -D clippy::perf
      - name: Test
        run: >-
          ./scripts/with-weston.sh cargo test --workspace --locked --
          --include-ignored --test-threads=1
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Dependency policy
        run: cargo deny check

  coverage:
    name: Coverage
    # One coverage run per PR: on open (or ready-for-review when opened as a draft) and on every
    # main push, but not on each synchronize push. The Codecov comment only needs one upload, and
    # Codecov statuses are informational (codecov.yml), so later commits without a fresh report
    # don't block merging. Re-run on demand by toggling the PR's draft state.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && (github.event.action == 'opened' || github.event.action == 'ready_for_review'))
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carver-gtk/web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Instrumented artifacts differ from the release build, so use a dedicated cache.
          shared-key: carver-coverage
          cache-all-crates: true
      - name: Install GTK dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev weston
      - name: Install coverage tool
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: TypeScript coverage
        working-directory: apps/carver-gtk/web
        run: npm ci && npm run coverage
      - name: Rust coverage
        run: |
          mkdir -p coverage
          ./scripts/with-weston.sh cargo llvm-cov --workspace --all-features --locked --fail-under-lines 85 \
            --lcov --output-path coverage/lcov.info -- --include-ignored --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info,apps/carver-gtk/web/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

  msrv:
    name: MSRV (Rust 1.98)
    concurrency:
      group: msrv-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/carver-gtk/web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep MSRV artifacts isolated from stable while reusing them on subsequent runs.
          shared-key: carver-msrv-1.98
      - name: Install GTK dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev
      - name: Check MSRV compatibility
        run: npm ci --prefix apps/carver-gtk/web && npm run build --prefix apps/carver-gtk/web && cargo check --workspace --all-targets --all-features --locked
