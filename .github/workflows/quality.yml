name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libadwaita-1-dev xvfb
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Lint
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings -D clippy::perf
      - name: Test
        run: >-
          xvfb-run -a cargo test --workspace --locked --
          --include-ignored --test-threads=1
      - name: Install coverage tool
        if: matrix.toolchain == 'stable'
        run: >-
          rustup component add llvm-tools-preview &&
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Coverage
        if: matrix.toolchain == 'stable'
        run: >-
          xvfb-run -a cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80
          -- --include-ignored --test-threads=1
      - name: Documentation
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Dependency policy
        if: matrix.toolchain == 'stable'
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check
