[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# BSD dependencies used for atomic replacement and HTML-aware rewriting.
[[licenses.exceptions]]
name = "atomic-write-file"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "lol_html"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "encoding_rs"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
