allow-branch = ["main"]
consolidate-commits = true
pre-release-commit-message = "chore: release {{version}}"
publish = false
shared-version = true
tag-message = "Carver {{version}}"
tag-name = "v{{version}}"
pre-release-hook = ["sh", "-c", "sh \"$WORKSPACE_ROOT/scripts/update-metainfo-release.sh\""]
